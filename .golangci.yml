version: "2"

linters:
  default: standard
  enable:
    - unparam
    - gosec
    - bodyclose
    - noctx
    - revive
    - gocritic
    - godox
  settings:
    revive:
      rules:
        - name: unused-parameter
    gocritic:
      enabled-checks:
        - commentedOutCode
      disabled-checks:
        - ifElseChain
    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
        - XXX
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
