syntax = "proto3";

// COMPATIBILITY: this file is a human-readable SPEC of the agent stream, not the
// compiled wire format — the wire is hand-written JSON, and the canonical
// schema is this Go contract module (agentpb + clusterspec). Both this spec
// and those types are ADDITIVE-ONLY: fields may be added, but a field number,
// name, JSON tag, or type is NEVER changed or removed without the deprecation
// process. The golden round-trip gate in agentwire enforces this in CI.
// Policy + support window (agent N / N-1 / N-2): docs/version-compatibility.md.

package agent.v1;

option go_package = "github.com/allodium-co/contract/agentpb";

// AgentService is the long-lived gRPC streaming endpoint the Data Plane Agent
// dials outbound. Both sides send AgentMessage frames over the same stream:
// the control plane pushes ClusterCommand, the agent responds with ClusterStatus.
service AgentService {
  rpc StreamCommands(stream AgentMessage) returns (stream AgentMessage);
}

message AgentMessage {
  oneof payload {
    ClusterCommand        command  = 1;
    ClusterStatus         status   = 2;
    ClusterSpec           desired  = 3; // control plane -> agent, full desired state
    ObservedClusterStatus observed = 4; // agent -> control plane, full observed state
  }
}

message ClusterCommand {
  string      id      = 1;
  CommandType type    = 2;
  string      payload = 3; // JSON-encoded extra params (e.g. replica count for SCALE)
}

message ClusterStatus {
  string command_id = 1;
  string phase      = 2; // stopped | starting | running | error
  string message    = 3;
  int64  timestamp  = 4; // Unix seconds
}

// ClusterSpec is the compute desired state (Go: clusterspec.ClusterSpec).
// Only compute shape, plus the IdP subject that owns a tool session, may
// appear here: no table, schema or query fields, results or credentials.
message ClusterSpec {
  repeated WarehouseSpec    warehouses     = 1;
  repeated SparkClusterSpec spark_clusters = 2;
  repeated ToolSessionSpec  tool_sessions  = 3;
}

message WarehouseSpec {
  string id                        = 1;
  string tenant_id                 = 2  [json_name = "tenant_id"];
  string name                      = 3;
  string profile                   = 4;
  int32  heap_size_gb              = 5  [json_name = "heap_size_gb"];
  string max_query_memory_per_node = 6  [json_name = "max_query_memory_per_node"];
  string max_total_memory_per_node = 7  [json_name = "max_total_memory_per_node"];
  string heap_headroom             = 8  [json_name = "heap_headroom"];
  string worker_mode               = 9  [json_name = "worker_mode"]; // none | static | keda
  string worker_profile            = 10 [json_name = "worker_profile"];
  int32  worker_heap_size_gb       = 11 [json_name = "worker_heap_size_gb"];
  int32  worker_min_replicas       = 12 [json_name = "worker_min_replicas"];
  int32  worker_max_replicas       = 13 [json_name = "worker_max_replicas"];
  int32  idle_timeout_mins         = 14 [json_name = "idle_timeout_mins"];
}

message SparkClusterSpec {
  string          id                 = 1;
  string          tenant_id          = 2 [json_name = "tenant_id"];
  string          name               = 3;
  int32           executor_instances = 4;
  string          executor_memory    = 5;
  int32           executor_cores     = 6;
  int32           driver_vcpus       = 7 [json_name = "driverVCPUs"];
  int32           driver_memory_gb   = 8 [json_name = "driverMemoryGB"];
  repeated string packages           = 9; // Maven coordinates or JAR URLs
}

// ToolSessionSpec is one user's tool session, such as a marimo notebook
// server. It never carries a token, key or other credential, a notebook path,
// a repository URL, an image reference or any notebook content. The data plane
// resolves tool and size against its own catalog, which pins each tool's image.
message ToolSessionSpec {
  string id            = 1; // lowercase RFC 1123 label, 26-61 chars; served at t-<id>.<domain>
  string owner_sub     = 2; // the owner's IdP subject
  string tool          = 3; // key into the data plane's tool catalog, e.g. "marimo"
  string size          = 4; // key into the catalog's sizes for tool
  string desired_phase = 5; // running | stopped
}

// ObservedClusterStatus is the observed compute state (Go:
// clusterspec.ClusterStatus). Metadata only: phases, messages and the agent's
// version, never query data.
message ObservedClusterStatus {
  repeated WorkloadStatus    warehouses          = 1;
  repeated WorkloadStatus    spark_clusters      = 2;
  repeated ToolSessionStatus tool_sessions       = 3;
  string                     last_reconcile_time = 4; // RFC 3339
  string                     agent_version       = 5;
}

message WorkloadStatus {
  string id      = 1;
  string name    = 2;
  string phase   = 3; // stopped | starting | running | error
  string message = 4;
}

message ToolSessionStatus {
  string id      = 1;
  string phase   = 2; // stopped | starting | running | error
  string message = 3; // never notebook content or tool output
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  START                    = 1;
  STOP                     = 2;
  SCALE                    = 3;
}